name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: applypilot
          POSTGRES_PASSWORD: applypilot
          POSTGRES_DB: applypilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U applypilot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://applypilot:applypilot@localhost:5432/applypilot_test
      TEST_DATABASE_URL: postgresql+psycopg://applypilot:applypilot@localhost:5432/applypilot_test
      # Throwaway CI-only values; never used outside this job.
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdefghijklmnop
      EMAIL_ENCRYPTION_KEY: ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2U=
      RESUME_ENCRYPTION_KEY: ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleWZha2U=
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - run: pip-audit -r requirements.txt
      - run: ruff check app --select E9,F --ignore F401,F821
      - run: alembic upgrade head
      - run: python -m unittest discover -s tests -v
      - name: Migration downgrade/upgrade round trip
        run: alembic downgrade b7c8d9e0f123 && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
