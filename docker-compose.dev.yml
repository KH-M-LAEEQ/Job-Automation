# Development override: mounts the source and runs reloading dev servers.
services:
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
  worker:
    volumes:
      - ./backend:/app
  frontend:
    build:
      target: build
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8010/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
